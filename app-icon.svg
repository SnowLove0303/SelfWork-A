<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Geometric Monogram for SelfWork (S + Workbench Layers) -->
  <g fill="none" stroke="#f8fafc" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top layer curve -->
    <path d="M 336 176 L 224 176 C 188 176 160 204 160 240 C 160 276 188 296 224 296 L 288 296 C 324 296 352 316 352 352 C 352 388 324 416 288 416 L 176 416" stroke-width="36"/>
    <!-- Center energy spark -->
    <circle cx="336" cy="176" r="14" fill="#38bdf8" stroke="none"/>
    <circle cx="176" cy="416" r="14" fill="#38bdf8" stroke="none"/>
  </g>
</svg>
